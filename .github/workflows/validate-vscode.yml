name: Validate VS Code theme

on:
  pull_request:
    paths:
      - ".github/workflows/validate-vscode.yml"
      - "checks/generated/helsing-vscode-token-contract.json"
      - "checks/validate-vscode.py"
      - "checks/validate.sh"
      - "docs/helsing-palette.yml"
      - "docs/helsing-vscode-role-matrix.md"
      - "generator/config/vscode-fixtures.yml"
      - "generator/config/vscode.yml"
      - "generator/generate.py"
      - "generator/requirements.txt"
      - "generator/templates/vscode/**"
      - "themes/vscode/**"
  push:
    paths:
      - ".github/workflows/validate-vscode.yml"
      - "checks/generated/helsing-vscode-token-contract.json"
      - "checks/validate-vscode.py"
      - "checks/validate.sh"
      - "docs/helsing-palette.yml"
      - "docs/helsing-vscode-role-matrix.md"
      - "generator/config/vscode-fixtures.yml"
      - "generator/config/vscode.yml"
      - "generator/generate.py"
      - "generator/requirements.txt"
      - "generator/templates/vscode/**"
      - "themes/vscode/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: themes/vscode/package-lock.json

      - name: Install generator dependencies
        run: python -m pip install -r generator/requirements.txt

      - name: Install extension dependencies
        working-directory: themes/vscode
        run: npm ci

      - name: Prepare package directory
        run: mkdir -p dist

      - name: Validate and package VSIX
        working-directory: themes/vscode
        run: npm run package:vsix -- --out ../../dist/helsing-theme.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: helsing-vscode-vsix
          path: dist/helsing-theme.vsix
          if-no-files-found: error
