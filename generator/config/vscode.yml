target: vscode
outputs:
  theme: themes/vscode/themes/helsing-color-theme.json
  role_matrix: docs/helsing-vscode-role-matrix.md
  test_contract: checks/generated/helsing-vscode-token-contract.json
fixtures: generator/config/vscode-fixtures.yml

metadata:
  name: Helsing
  type: light
  semantic_highlighting: true

helpers:
  diff_add: "#DCEEDB"
  diff_change: "#E8E1F3"
  diff_delete: "#F3D9D9"
  editor_line: "#EFE9DF"
  linenr: "#B3ADA4"
  input_bg: "#ECE7DE"
  input_active: "#DDD4C5"
  find_match: "#F1E7B8"
  current_find_match: "#E8D58B"

helper_usage:
  diff_add: "Background for inserted diff lines and text."
  diff_change: "Reserved diff-change surface for targets that distinguish changed from inserted content."
  diff_delete: "Background for removed diff lines and text."
  editor_line: "Current editor-line background."
  linenr: "Inactive editor line numbers."
  input_bg: "Input, completion and suggestion surfaces."
  input_active: "Selected input, suggestion and hover surface."
  find_match: "Non-current search-match background."
  current_find_match: "Current search-match and strong word-highlight background."

scope_allowlist:
  support.function:
    role: function
    reason: "Built-in and runtime-provided callables are functions when no semantic provider is available."
  support.type:
    role: type
    reason: "Grammar-provided built-in types are types when no semantic provider is available."
  variable:
    role: variable
    reason: "This fallback deliberately uses the ordinary foreground, so it cannot steal an accent from a more specific rule."

coverage:
  required_roles:
    - keyword
    - operator
    - function
    - type
    - namespace
    - string
    - regexp
    - number
    - constant
    - decorator
    - variable
    - parameter
    - property
    - punctuation
    - comment
  semantic_fallbacks:
    punctuation: "The LSP semantic-token vocabulary has no punctuation token; TextMate remains authoritative."

colors:
  foreground: fg
  focusBorder: blue
  widget.border: border
  widget.shadow: selection
  selection.background: selection
  descriptionForeground: muted
  errorForeground: red
  icon.foreground: fg

  textLink.foreground: blue
  textLink.activeForeground: info
  textBlockQuote.background: bg_alt
  textBlockQuote.border: border
  textCodeBlock.background: bg_alt
  textPreformat.foreground: orange
  textSeparator.foreground: border

  button.background: blue
  button.foreground: bg
  button.hoverBackground: info
  button.secondaryBackground: bg_alt
  button.secondaryForeground: fg
  button.secondaryHoverBackground: selection

  dropdown.background: input_bg
  dropdown.foreground: fg
  dropdown.border: border

  input.background: input_bg
  input.foreground: fg
  input.border: border
  input.placeholderForeground: muted
  inputOption.activeBorder: blue
  inputValidation.infoBorder: info
  inputValidation.warningBorder: yellow
  inputValidation.errorBorder: red

  editor.background: bg
  editor.foreground: fg
  editorCursor.foreground: fg
  editor.selectionBackground: selection
  editor.inactiveSelectionBackground: bg_alt
  editor.lineHighlightBackground: editor_line
  editor.findMatchBackground: current_find_match
  editor.findMatchHighlightBackground: find_match
  editor.findRangeHighlightBackground: bg_alt
  editor.hoverHighlightBackground: selection
  editor.wordHighlightBackground: selection
  editor.wordHighlightStrongBackground: current_find_match
  editorLineNumber.foreground: linenr
  editorLineNumber.activeForeground: orange
  editorWhitespace.foreground: border
  editorIndentGuide.background: border
  editorIndentGuide.activeBackground: subtle
  editorRuler.foreground: border
  editorBracketMatch.background: selection
  editorBracketMatch.border: orange

  editorGutter.background: bg
  editorGutter.modifiedBackground: purple
  editorGutter.addedBackground: green
  editorGutter.deletedBackground: red

  editorError.foreground: red
  editorWarning.foreground: yellow
  editorInfo.foreground: info
  editorHint.foreground: cyan

  editorWidget.background: bg_alt
  editorWidget.border: border
  editorHoverWidget.background: bg_alt
  editorHoverWidget.foreground: fg
  editorHoverWidget.border: border
  editorSuggestWidget.background: input_bg
  editorSuggestWidget.foreground: fg
  editorSuggestWidget.border: border
  editorSuggestWidget.selectedBackground: input_active
  editorSuggestWidget.highlightForeground: blue

  peekView.border: border
  peekViewEditor.background: bg
  peekViewResult.background: bg_alt
  peekViewResult.selectionBackground: selection
  peekViewTitle.background: bg_alt
  peekViewTitleLabel.foreground: fg
  peekViewTitleDescription.foreground: muted

  diffEditor.insertedLineBackground: diff_add
  diffEditor.removedLineBackground: diff_delete
  diffEditor.insertedTextBackground: diff_add
  diffEditor.removedTextBackground: diff_delete
  diffEditor.diagonalFill: border

  list.activeSelectionBackground: selection
  list.activeSelectionForeground: fg
  list.inactiveSelectionBackground: bg_alt
  list.hoverBackground: input_active
  list.highlightForeground: blue
  list.focusOutline: border
  list.errorForeground: red
  list.warningForeground: yellow

  sideBar.background: bg_alt
  sideBar.foreground: fg
  sideBar.border: border
  sideBarTitle.foreground: fg

  activityBar.background: bg_alt
  activityBar.foreground: fg
  activityBar.inactiveForeground: muted
  activityBar.border: border
  activityBarBadge.background: blue
  activityBarBadge.foreground: bg

  panel.background: bg_alt
  panel.border: border
  panelTitle.activeForeground: fg
  panelTitle.inactiveForeground: muted
  panelTitle.activeBorder: blue

  statusBar.background: bg_alt
  statusBar.foreground: fg
  statusBar.border: border
  statusBar.debuggingBackground: orange
  statusBar.debuggingForeground: bg
  statusBar.noFolderBackground: bg_alt
  statusBarItem.hoverBackground: selection
  statusBarItem.prominentBackground: selection

  tab.activeBackground: bg
  tab.activeForeground: fg
  tab.inactiveBackground: bg_alt
  tab.inactiveForeground: muted
  tab.border: border
  tab.hoverBackground: selection

  terminal.background: bg
  terminal.foreground: fg
  terminalCursor.foreground: fg
  terminal.selectionBackground: selection
  terminal.ansiBlack: fg
  terminal.ansiRed: red
  terminal.ansiGreen: green
  terminal.ansiYellow: yellow
  terminal.ansiBlue: blue
  terminal.ansiMagenta: pink
  terminal.ansiCyan: cyan
  terminal.ansiWhite: bg_alt
  terminal.ansiBrightBlack: muted
  terminal.ansiBrightRed: red
  terminal.ansiBrightGreen: green
  terminal.ansiBrightYellow: yellow
  terminal.ansiBrightBlue: info
  terminal.ansiBrightMagenta: pink
  terminal.ansiBrightCyan: cyan
  terminal.ansiBrightWhite: bg

  scrollbarSlider.background: border
  scrollbarSlider.hoverBackground: subtle
  scrollbarSlider.activeBackground: muted

tokenColors:
  - name: Comments
    role: comment
    scope:
      - comment
      - punctuation.definition.comment
    settings:
      fontStyle: italic

  - name: Strings
    role: string
    scope:
      - string
      - string.quoted
      - string.template
    settings: {}

  - name: Regular Expressions
    role: regexp
    scope:
      - string.regexp
      - constant.regexp
    settings: {}

  - name: Numbers
    role: number
    scope:
      - constant.numeric
      - constant.language.boolean
      - constant.language.json
    settings: {}

  - name: Keywords
    role: keyword
    scope:
      - keyword
      - keyword.control
      - storage.modifier
      - storage.type.class.python
      - storage.type.function.python
      - storage.type.function.async.python
      - storage.type.function.lambda.python
      - storage.type.c
      - storage.type.cpp
      - storage.type.function.shell
      - storage.type.alias.shell
      - storage.type.js
      - storage.type.js.jsx
      - storage.type.class.js
      - storage.type.class.js.jsx
      - storage.type.enum.js
      - storage.type.enum.js.jsx
      - storage.type.function.js
      - storage.type.function.js.jsx
      - storage.type.interface.js
      - storage.type.interface.js.jsx
      - storage.type.namespace.js
      - storage.type.namespace.js.jsx
      - storage.type.type.js
      - storage.type.type.js.jsx
      - storage.type.ts
      - storage.type.tsx
      - storage.type.class.ts
      - storage.type.class.tsx
      - storage.type.enum.ts
      - storage.type.enum.tsx
      - storage.type.function.ts
      - storage.type.function.tsx
      - storage.type.interface.ts
      - storage.type.interface.tsx
      - storage.type.namespace.ts
      - storage.type.namespace.tsx
      - storage.type.type.ts
      - storage.type.type.tsx
    settings: {}

  - name: Operators
    role: operator
    scope:
      - keyword.operator
    settings: {}

  - name: Punctuation
    role: punctuation
    scope:
      - punctuation.separator
      - punctuation.terminator
    settings: {}

  - name: Functions
    role: function
    scope:
      - entity.name.function
      - support.function
      - meta.function-call entity.name.function
      - meta.function-call.python entity.name.function.python
    settings: {}

  - name: Types
    role: type
    scope:
      - entity.name.type
      - support.type
      - storage.type.built-in.c
      - storage.type.built-in.primitive.c
      - storage.type.built-in.cpp
      - storage.type.built-in.primitive.cpp
      - storage.type.boolean.go
      - storage.type.byte.go
      - storage.type.error.go
      - storage.type.numeric.go
      - storage.type.rune.go
      - storage.type.string.go
      - storage.type.uintptr.go
    settings: {}

  - name: Constants
    role: constant
    scope:
      - constant
      - variable.other.constant
      - support.constant
    settings: {}

  - name: Variables
    role: variable
    scope:
      - variable
      - meta.definition.variable
    settings: {}

  - name: Parameters
    role: parameter
    scope:
      - variable.parameter
    settings: {}

  - name: Properties
    role: property
    scope:
      - variable.other.property
      - meta.property-name
      - support.type.property-name.css
      - support.type.property-name.json
      - support.type.property-name.toml
      - entity.name.tag.yaml
    settings: {}

  - name: Tags
    role: type
    scope:
      - entity.name.tag
    settings: {}

  - name: Attributes
    role: attribute
    scope:
      - entity.other.attribute-name
    settings: {}

  - name: Decorators
    role: decorator
    scope:
      - entity.name.function.decorator
      - punctuation.definition.decorator
    settings: {}

  - name: Modules and Namespaces
    role: namespace
    scope:
      - entity.name.namespace
      - entity.name.module
    settings: {}

  - name: Invalid
    role: error
    scope:
      - invalid
      - invalid.illegal
    settings:
      fontStyle: ""

  - name: Markdown Headings
    role: heading
    scope:
      - markup.heading
    settings:
      fontStyle: bold

  - name: Markdown Bold
    role: emphasis
    scope:
      - markup.bold
    settings:
      fontStyle: bold

  - name: Markdown Italic
    role: emphasis
    scope:
      - markup.italic
    settings:
      fontStyle: italic

  - name: Markdown Links
    role: link
    scope:
      - markup.underline.link
      - string.other.link
    settings:
      fontStyle: underline

semanticTokenColors:
  class:
    role: type
    settings: {}
  comment:
    role: comment
    settings:
      fontStyle: italic
  clsParameter:
    role: parameter
    settings: {}
  decorator:
    role: decorator
    settings: {}
  enum:
    role: type
    settings: {}
  enumMember:
    role: constant
    settings: {}
  function:
    role: function
    settings: {}
  interface:
    role: type
    settings: {}
  intrinsic:
    role: builtin_function
    settings: {}
  keyword:
    role: keyword
    settings: {}
  macro:
    role: constant
    settings:
      fontStyle: italic
  magicFunction:
    role: function
    settings: {}
  member:
    role: function
    settings: {}
  method:
    role: function
    settings: {}
  module:
    role: namespace
    settings: {}
  namespace:
    role: namespace
    settings: {}
  number:
    role: number
    settings: {}
  operator:
    role: operator
    settings: {}
  parameter:
    role: parameter
    settings: {}
  property:
    role: property
    settings: {}
  regexp:
    role: regexp
    settings: {}
  selfParameter:
    role: parameter
    settings: {}
  string:
    role: string
    settings: {}
  type:
    role: type
    settings: {}
  typeParameter:
    role: type
    settings: {}
  variable:
    role: variable
    settings: {}
  variable.defaultLibrary:
    role: builtin_function
    settings:
      fontStyle: italic
  variable.readonly:
    role: constant
    settings: {}
  "*.abstract":
    modifier: true
    settings:
      fontStyle: italic
  "*.async":
    modifier: true
    settings:
      fontStyle: italic
  "*.builtin":
    modifier: true
    settings:
      fontStyle: italic
  "*.declaration":
    modifier: true
    settings:
      fontStyle: bold
  "*.definition":
    modifier: true
    settings:
      fontStyle: bold
  "*.documentation":
    modifier: true
    settings:
      fontStyle: italic
  "*.modification":
    modifier: true
    settings:
      fontStyle: underline
  "*.static":
    modifier: true
    settings:
      fontStyle: italic
