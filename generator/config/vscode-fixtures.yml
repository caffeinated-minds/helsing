inspection:
  vscode_version: "1.119.0"
  method: "Developer: Inspect Editor Tokens and Scopes"
  status: "Grammar-derived expectations recorded; final semantic-provider observations require interactive confirmation."

fixtures:
  - path: themes/vscode/examples/archive.py
    language: python
    expectations:
      - text: def
        occurrence: 2
        role: keyword
        textmate_scopes: [storage.type.function.python]
        semantic_token: keyword
      - text: class
        occurrence: 1
        role: keyword
        textmate_scopes: [storage.type.class.python]
        semantic_token: keyword
      - text: Threat
        occurrence: 1
        role: type
        textmate_scopes: [entity.name.type.class.python]
        semantic_token: class
      - text: CLEAR
        occurrence: 1
        role: constant
        textmate_role: variable
        fallback_reason: "The Python grammar exposes enum members as ordinary read/write variables; Pylance supplies enumMember semantics."
        textmate_scopes: [variable.other.readwrite.python]
        semantic_token: enumMember
      - text: '"clear"'
        occurrence: 1
        role: string
        textmate_scopes: [string.quoted.double.python]
        semantic_token: string
      - text: "3"
        occurrence: 1
        role: number
        textmate_scopes: [constant.numeric.dec.python]
        semantic_token: number

  - path: themes/vscode/examples/sentinel.go
    language: go
    expectations:
      - text: func
        occurrence: 1
        role: keyword
        textmate_scopes: [keyword.function.go]
        semantic_token: keyword
      - text: ThreatLevel
        occurrence: 1
        role: type
        textmate_scopes: [entity.name.type.go]
        semantic_token: type
      - text: ThreatSevere
        occurrence: 1
        role: constant
        textmate_scopes: [variable.other.constant.go]
        semantic_token: variable.readonly
      - text: Patrol
        occurrence: 1
        role: function
        textmate_scopes: [entity.name.function.go]
        semantic_token: method
      - text: '"warning: close the curtains near %s"'
        occurrence: 1
        role: string
        textmate_scopes: [string.quoted.double.go]
        semantic_token: string

  - path: themes/vscode/examples/patrol.sh
    language: shellscript
    expectations:
      - text: readonly
        occurrence: 1
        role: keyword
        textmate_scopes: [storage.modifier.shell]
        semantic_token: keyword
      - text: log
        occurrence: 1
        role: function
        textmate_scopes: [entity.name.function.shell]
        semantic_token: function
      - text: REPORT_DIR
        occurrence: 1
        role: constant
        textmate_role: variable
        fallback_reason: "The Bash grammar exposes readonly assignments as ordinary read/write variables; a semantic provider may add readonly information."
        textmate_scopes: [variable.other.readwrite.shell]
        semantic_token: variable.readonly
      - text: '"clear"'
        occurrence: 1
        role: string
        textmate_scopes: [string.quoted.double.shell]
        semantic_token: string

  - path: themes/vscode/examples/watch.js
    language: javascript
    expectations:
      - text: class
        occurrence: 1
        role: keyword
        textmate_scopes: [storage.type.class.js]
        semantic_token: keyword
      - text: DaylightWatch
        occurrence: 1
        role: type
        textmate_scopes: [entity.name.type.class.js]
        semantic_token: class
      - text: MAX_SHADOWS
        occurrence: 1
        role: constant
        textmate_scopes: [variable.other.constant.js]
        semantic_token: variable.readonly
      - text: inspect
        occurrence: 1
        role: function
        textmate_scopes: [entity.name.function.js]
        semantic_token: function
      - text: '"severe"'
        occurrence: 1
        role: string
        textmate_scopes: [string.quoted.double.js]
        semantic_token: string

  - path: themes/vscode/examples/ward.ts
